site_name: PT Playbook
theme:
  name: material
  palette:
    scheme: slate
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Generic:
      - generic/scans.md
      - generic/bruteforcing.md
      - generic/publicexploits.md
      - generic/pivoting.md
  - Privilege Escalation:
      - Windows Privesc:
        - privesc/windows/windowsosenum.md
      - Linux Privesc:
          - privesc/linux/linuxosenum.md
          - privesc/linux/informationexposure.md
  - Active Directory:
      - activedirectory/adenumeration.md
  - Service Enumeration:
      - services/dns.md
      - services/ftp.md
      - services/http.md
      - services/nfs.md
      - services/rdp.md
      - services/rpc.md
      - services/smtp.md
      - services/snmp.md
      - services/ssh.md
      - services/telnet.md
      - services/tftp.md
      - services/whois.md