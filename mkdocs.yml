site_name: PT Playbook
theme:
  name: material
  palette:
    scheme: slate
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Generic:
      - generic/scans.md
      - generic/bruteforcing.md
      - generic/publicexploits.md
      - generic/pivoting.md
  - Privilege Escalation:
      - Windows Privesc:
          - privesc/windows/windowsosenum.md
          - privesc/windows/exposedcredentials.md
          - privesc/windows/windowsservices.md
          - privesc/windows/othercomponents.md
      - Linux Privesc:
          - privesc/linux/linuxosenum.md
          - privesc/linux/informationexposure.md
          - privesc/linux/insecurefilepermissions.md
          - privesc/linux/insecuresystemcomponents.md
  - Active Directory:
      - activedirectory/adenumeration.md
      - activedirectory/cachedadcreds.md
      - activedirectory/passwordattacks.md
      - activedirectory/asreproast.md
      - activedirectory/kerberoasting.md
      - activedirectory/silvertickets.md
      - activedirectory/dcsync.md
  - Resources:
      - resources/poisoned_bin.md
      - resources/web_payloads.md
      - resources/spraypasswords.md
  - Web App Attacks:
      - web/dirtraversal.md
      - web/lfi.md
      - web/phpwrappers.md
      - web/rfi.md
      - web/uploads.md
      - web/cmdinjection.md
      - web/sqli.md
  - Service Enumeration:
      - services/dns.md
      - services/ftp.md
      - services/http.md
      - services/nfs.md
      - services/rdp.md
      - services/rpc.md
      - services/smtp.md
      - services/snmp.md
      - services/ssh.md
      - services/telnet.md
      - services/tftp.md
      - services/whois.md
      - services/smb.md
      - services/kerberos.md
      - services/msrpc.md
      - services/winrm.md